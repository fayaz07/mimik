name: CI

on: [push, pull_request]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: "23.x"
      # - run: npm ci
      # - run: npm run lint
      - run: npm install
      - run: npm run make
